<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Admin - Dogão do Paulista</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --muted: #94a3b8; --border: #334155; --primary: #0098a6; --danger: #ef4444; --success: #10b981; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding-bottom: 50px; }
    header { background: #1e293b; border-bottom: 1px solid var(--border); padding: 18px 16px; text-align: center; }
    h1 { font-family: 'Fredoka', cursive; font-size: 1.5rem; color: #38bdf8; }
    .container { max-width: 500px; margin: 0 auto; padding: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
    .card-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-status { padding: 16px; border-radius: 12px; border: 2px solid var(--border); font-size: 0.9rem; font-weight: 800; cursor: pointer; text-align: center; background: #0f172a; color: var(--muted); }
    .btn-status.active-open { background: #064e3b; border-color: var(--success); color: #34d399; }
    .btn-status.active-closed { background: #7f1d1d; border-color: var(--danger); color: #f87171; }
    .input-text { width: 100%; background: #0f172a; border: 1px solid var(--border); border-radius: 10px; color: white; padding: 12px; font-size: 0.9rem; outline: none; }
    .btn-save { background: #0284c7; color: white; border: none; width: 100%; padding: 16px; border-radius: 14px; font-weight: 800; font-size: 1rem; cursor: pointer; margin-top: 10px; }
    .alert-saved { display: none; background: #064e3b; color: #34d399; padding: 12px; border-radius: 10px; text-align: center; font-weight: 700; margin-top: 12px; }
    .loading { text-align: center; padding: 10px; color: #38bdf8; font-weight: 600; font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <h1>⚙️ Painel do Dono</h1>
    <p style="font-size:0.8rem; color:var(--muted); margin-top:4px;">Dogão do Paulista</p>
  </header>

  <div class="container">
    <div id="loadingStatus" class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Conectando à nuvem...</div>

    <div class="card">
      <div class="card-title"><i class="fa-solid fa-power-off"></i> Status do Cardápio</div>
      <div class="mode-grid">
        <button type="button" class="btn-status" id="btnOpen" onclick="selectStatus('open')">
          <i class="fa-solid fa-lock-open" style="font-size: 1.3rem; display: block; margin-bottom: 6px;"></i>
          ABERTO
        </button>
        <button type="button" class="btn-status" id="btnClosed" onclick="selectStatus('closed')">
          <i class="fa-solid fa-lock" style="font-size: 1.3rem; display: block; margin-bottom: 6px;"></i>
          FECHADO
        </button>
      </div>
    </div>

    <div class="card">
      <div class="card-title"><i class="fa-solid fa-bullhorn"></i> Comunicado / Aviso aos Clientes</div>
      <input type="text" id="announcementInput" class="input-text" placeholder="Ex: Hoje abriremos com 20 minutos de atraso...">
    </div>

    <button class="btn-save" id="btnSave" onclick="saveToCloud()">
      <i class="fa-solid fa-cloud-arrow-up"></i> SALVAR ALTERAÇÃO NA NUVEM
    </button>
    <div class="alert-saved" id="alertSaved">✅ Cardápio Atualizado na Nuvem!</div>
  </div>

  <script>
    // Nuvem pública via npoint para sincronizar instantaneamente o admin com os clientes
    const CLOUD_URL = "https://api.npoint.io/4fa149ca71a62061266b";
    let currentMode = "open";

    async function fetchCloudStatus() {
      try {
        const res = await fetch(CLOUD_URL);
        const data = await res.json();
        currentMode = data.mode || "open";
        document.getElementById('announcementInput').value = data.announcement || "";
        updateUI();
        document.getElementById('loadingStatus').style.display = "none";
      } catch (e) {
        document.getElementById('loadingStatus').innerText = "Modo offline local ativo";
      }
    }

    function selectStatus(status) {
      currentMode = status;
      updateUI();
    }

    function updateUI() {
      const openBtn = document.getElementById('btnOpen');
      const closedBtn = document.getElementById('btnClosed');
      if (currentMode === 'open') {
        openBtn.className = "btn-status active-open";
        closedBtn.className = "btn-status";
      } else {
        openBtn.className = "btn-status";
        closedBtn.className = "btn-status active-closed";
      }
    }

    async function saveToCloud() {
      const saveBtn = document.getElementById('btnSave');
      saveBtn.innerText = "Salvando...";
      saveBtn.disabled = true;

      const payload = {
        mode: currentMode,
        announcement: document.getElementById('announcementInput').value.trim()
      };

      try {
        await fetch(CLOUD_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        // Salva backup local
        localStorage.setItem('dogao_admin_config', JSON.stringify(payload));

        const alertEl = document.getElementById('alertSaved');
        alertEl.style.display = 'block';
        setTimeout(() => { alertEl.style.display = 'none'; }, 2500);
      } catch (err) {
        alert('Erro ao sincronizar com a internet. Verifique sua conexão.');
      } finally {
        saveBtn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up"></i> SALVAR ALTERAÇÃO NA NUVEM';
        saveBtn.disabled = false;
      }
    }

    fetchCloudStatus();
  </script>
</body>
</html>
